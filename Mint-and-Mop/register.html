<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | Mint &amp; Mop Portal</title>
  <meta name="description" content="Create your Mint &amp; Mop customer account to schedule free inspections, track remediation milestones, and download certified air reports.">
  
  <link rel="icon" type="image/svg+xml" href="images/mint-mop-logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
<link rel="stylesheet" href="css/mint-mop-responsive.css">
</head>
<body class="bg-surface d-flex flex-column min-vh-100">

  <!-- Header -->
  <header class="py-3 border-bottom border-color bg-card">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="index.html">
        <span class="brand-icon mint-brand-icon"><img src="images/mint-mop-logo.svg" alt="" width="44" height="44" loading="eager" decoding="async"></span>
        <span>Mint <span class="brand-badge">&amp; Mop</span></span>
      </a>

      <div class="d-flex align-items-center gap-2">
        <button type="button" class="btn-control-toggle rtl-toggle-btn" id="rtlToggleBtn" title="Switch text direction">
          <span class="toggle-label">RTL</span>
        </button>
        <button type="button" class="btn-control-toggle theme-toggle-btn" id="themeToggleBtn" title="Toggle theme mode">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill ms-2 px-3">
          <i class="bi bi-arrow-left me-1"></i> Back to Website
        </a>
      </div>
    </div>
  </header>

  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-6">
          <div class="bg-card p-4 p-sm-5 rounded-4 border border-color shadow-xl">
            
            <div class="text-center mb-4">
              <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                <i class="bi bi-person-plus-fill"></i>
              </div>
              <h2 class="fw-bold mb-1">Create Customer Account</h2>
              <p class="text-muted small">Register to track your inspection report, warranty, and technician dispatches.</p>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">
              <div id="registerAlert" class="alert alert-danger d-none mb-3 small"></div>
              <div id="registerSuccess" class="alert alert-success d-none mb-3 small"></div>

              <div class="row g-3">
                <div class="col-12">
                  <label for="regFullName" class="form-label">Full Name *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-surface-2 border-color text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="regFullName" placeholder="Eleanor Vance" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="regEmail" class="form-label">Email Address *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-surface-2 border-color text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="regEmail" placeholder="eleanor@example.com" required>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="regPhone" class="form-label">Phone Number *</label>
                  <div class="input-group">
                    <span class="input-group-text bg-surface-2 border-color text-muted"><i class="bi bi-telephone"></i></span>
                    <input type="tel" class="form-control" id="regPhone" placeholder="(555) 456-7890" required>
                  </div>
                </div>

                <!-- Password with Strength Guidance -->
                <div class="col-md-6">
                  <label for="regPassword" class="form-label">Password *</label>
                  <div class="password-input-group">
                    <input type="password" class="form-control" id="regPassword" placeholder="Minimum 8 characters" required>
                    <button type="button" class="password-toggle-btn" data-target="regPassword" aria-label="Toggle password visibility">
                      <i class="bi bi-eye-fill"></i>
                    </button>
                  </div>
                  <!-- Strength Meter Bar -->
                  <div class="strength-meter">
                    <div class="strength-meter-bar" id="strengthBar"></div>
                  </div>
                  <div class="d-flex justify-content-between align-items-center mt-1">
                    <small class="text-muted" style="font-size: 0.75rem;">Include uppercase, number & symbol</small>
                    <small id="strengthText" class="fw-bold" style="font-size: 0.75rem;"></small>
                  </div>
                </div>

                <!-- Confirm Password -->
                <div class="col-md-6">
                  <label for="regConfirmPassword" class="form-label">Confirm Password *</label>
                  <div class="password-input-group">
                    <input type="password" class="form-control" id="regConfirmPassword" placeholder="Re-type password" required>
                    <button type="button" class="password-toggle-btn" data-target="regConfirmPassword" aria-label="Toggle password visibility">
                      <i class="bi bi-eye-fill"></i>
                    </button>
                  </div>
                </div>

                <div class="col-12 mt-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="termsCheck" required>
                    <label class="form-check-label small text-muted" for="termsCheck">
                      I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a>.
                    </label>
                  </div>
                </div>

                <div class="col-12 mt-4">
                  <button type="submit" id="regBtn" class="btn-cta-primary w-100 py-3 fs-6 justify-content-center">
                    Create My Account <i class="bi bi-arrow-right ms-2"></i>
                  </button>
                </div>
              </div>

              <div class="text-center mt-4 pt-3 border-top border-color">
                <p class="text-muted small mb-0">
                  Already have an account? 
                  <a href="login.html" class="fw-bold text-primary">Sign In here</a>
                </p>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center border-top border-color bg-card">
    <p class="mb-0 small text-muted">© 2026 Mint &amp; Mop. Secure 256-Bit SSL Encrypted Registration.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    function handleRegister() {
      const name = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const pass = document.getElementById('regPassword').value;
      const confirmPass = document.getElementById('regConfirmPassword').value;
      const terms = document.getElementById('termsCheck').checked;

      const alertBox = document.getElementById('registerAlert');
      const successBox = document.getElementById('registerSuccess');
      const btn = document.getElementById('regBtn');

      alertBox.classList.add('d-none');
      successBox.classList.add('d-none');

      if (!name || !email || !phone || !pass || !confirmPass) {
        alertBox.textContent = 'Please fill out all required fields.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (pass.length < 8) {
        alertBox.textContent = 'Password must be at least 8 characters in length.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (pass !== confirmPass) {
        alertBox.textContent = 'Passwords do not match. Please re-enter identical passwords.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (!terms) {
        alertBox.textContent = 'You must agree to the Terms of Service to proceed.';
        alertBox.classList.remove('d-none');
        return;
      }

      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating Account...';
      btn.disabled = true;

      setTimeout(() => {
        btn.innerHTML = 'Create My Account <i class="bi bi-arrow-right ms-2"></i>';
        btn.disabled = false;
        successBox.textContent = 'Account created successfully! Redirecting to login...';
        successBox.classList.remove('d-none');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      }, 700);
    }
  </script>
</body>
</html>
